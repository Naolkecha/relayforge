name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Formatting
        run: ruff format --check src tests
      - name: Type checking
        run: mypy src/relayforge
      - name: Tests with branch coverage
        run: pytest
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-data
          path: .coverage
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relayforge
          POSTGRES_PASSWORD: relayforge
          POSTGRES_DB: relayforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELAYFORGE_ENVIRONMENT: test
      RELAYFORGE_DATABASE_URL: postgresql+asyncpg://relayforge:relayforge@localhost:5432/relayforge_test
      RELAYFORGE_REDIS_URL: redis://localhost:6379/15
      RELAYFORGE_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Generate ephemeral CI secret when repository secret is absent
        shell: bash
        run: |
          if [ -z "$RELAYFORGE_JWT_SECRET" ]; then
            echo "RELAYFORGE_JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          fi
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run integration tests
        run: pytest -m integration --no-cov
