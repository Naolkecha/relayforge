[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "relayforge"
version = "0.1.0"
description = "Production-oriented workflow orchestration backend with secure HTTP actions, idempotency, and auditability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RelayForge Contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47",
  "redis>=5.2,<7",
  "prometheus-client>=0.21,<1",
  "python-multipart>=0.0.12,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyJWT>=1.7,<2",
  "testcontainers[postgres,redis]>=4.9,<5",
  "pip-audit>=2.7,<3",
  "bandit[toml]>=1.7,<2",
  "pre-commit>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/relayforge"]

[tool.pytest.ini_options]
addopts = '-ra --strict-markers --strict-config -m "not integration" --cov=relayforge --cov-report=term-missing --cov-fail-under=60'
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires external services or testcontainers",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["relayforge"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["relayforge"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
